services:
  db:
    image: pgvector/pgvector:0.8.7-pg17-trixie
    environment:
      POSTGRES_DB: lumina
      POSTGRES_USER: lumina
      POSTGRES_PASSWORD: local-demo-only
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumina -d lumina"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      args:
        LUMINA_EMBEDDING_BACKEND: ${LUMINA_EMBEDDING_BACKEND:-hash}
    environment:
      DATABASE_URL: postgresql://lumina:local-demo-only@db:5432/lumina
      REDIS_URL: redis://redis:6379/0
      LUMINA_PROVIDER: fake
      LUMINA_EMBEDDING_BACKEND: ${LUMINA_EMBEDDING_BACKEND:-hash}
    ports:
      - "127.0.0.1:18765:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - modelcache:/home/lumina/.cache/fastembed

volumes:
  pgdata:
  modelcache:
