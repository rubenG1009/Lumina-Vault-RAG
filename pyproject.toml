[project]
name = "lumina-vault-rag"
version = "0.1.0"
description = "A modest, offline-first document retrieval and grounded quotation demo"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "psycopg[binary]>=3.2,<4",
  "pypdf>=5,<7", "redis>=5,<7", "httpx>=0.28,<1", "mcp>=1.12,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "fakeredis[lua]>=2.28,<3", "reportlab>=4,<5", "ruff>=0.11,<1"]

[project.scripts]
lumina = "lumina.cli:main"
lumina-mcp = "lumina.mcp_server:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lumina"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires TEST_DATABASE_URL and TEST_REDIS_URL"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
