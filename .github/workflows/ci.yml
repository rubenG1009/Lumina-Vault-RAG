name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17-trixie
        env:
          POSTGRES_DB: lumina_test
          POSTGRES_USER: lumina
          POSTGRES_PASSWORD: local-demo-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lumina -d lumina_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://lumina:local-demo-only@localhost:5432/lumina_test
      TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install . pytest reportlab ruff
      - run: ruff check lumina tests
      - run: pytest -q
      - run: lumina eval --output evals/results-ci.json
